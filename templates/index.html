{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Shower Celebration | Rajil &amp; Khushbu</title>
  <meta name="description" content="You are cordially invited to celebrate the auspicious Baby Shower (Shrimant Sanskar) celebration of Rajil &amp; Khushbu! Thursday, 19 November 2026 at The Grand Murli, Surat." />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="{% static 'assets/favicon.jpg' %}" />
  <link rel="apple-touch-icon" href="{% static 'assets/favicon.jpg' %}" />

  <!-- OpenGraph Meta Tags for Link Sharing (WhatsApp, Facebook, iMessage, Instagram) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Baby Shower Celebration | Rajil &amp; Khushbu" />
  <meta property="og:description" content="Auspicious Shrimant Sanskar of Rajil &amp; Khushbu! Thursday, 19 November 2026 at The Grand Murli, Surat." />
  <meta property="og:image" content="https://invitation.biz499.com{% static 'assets/og image.jpg' %}" />
  <meta property="og:image:secure_url" content="https://invitation.biz499.com{% static 'assets/og image.jpg' %}" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="Rajil &amp; Khushbu Baby Shower Celebration Invitation" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Baby Shower Celebration | Rajil &amp; Khushbu" />
  <meta name="twitter:description" content="Auspicious Shrimant Sanskar of Rajil &amp; Khushbu! Thursday, 19 November 2026 at The Grand Murli, Surat." />
  <meta name="twitter:image" content="https://invitation.biz499.com{% static 'assets/og image.jpg' %}" />

  <style>

  /* =================================
     GENERAL - NO SCROLL
  ================================= */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #fff9f5;
    color: #704d50;
  }

  /* =================================
     SECTION 1 - HERO VIDEO
  ================================= */

  .hero {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #49383b;
  }

  .hero-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Desktop video */

  .desktop-video {
    display: block;
  }

  /* Mobile video */

  .mobile-video {
    display: none;
  }

  @media (max-width: 700px) {

    .desktop-video {
      display: none;
    }

    .mobile-video {
      display: block;
    }

  }

  /* =================================
     EVENT CARD - POSITIONED BELOW FACES
     Both faces remain completely visible!
  ================================= */

  .hero-content {
    position: absolute;
    bottom: 74px;
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding: 0 12px;
    z-index: 2;
    text-align: center;
    color: white;
    pointer-events: none;
  }

  .event-details {
    pointer-events: auto;
    margin: 0 auto;
    width: min(100%, 380px);
    padding: 13px 15px;
    border-radius: 16px;

    background: rgba(35, 25, 27, 0.70);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.32);

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.30);
  }

  /* TITLE */

  .event-title {
    font-size: 24px;
    font-weight: normal;
    margin-bottom: 2px;
    color: #fff;
    letter-spacing: 0.5px;
  }

  /* DATE (BIGGER) */

  .event-date {
    font-family: Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #fff;
    letter-spacing: 0.5px;
  }

  /* =================================
     EVENT TIMINGS
  ================================= */

  .event-times {
    display: grid;
    grid-template-columns: 1fr 1fr;

    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);

    margin-bottom: 8px;
  }

  .event-time {
    padding: 7px 4px;
  }

  .event-time + .event-time {
    border-left: 1px solid rgba(255, 255, 255, 0.3);
  }

  .event-time div {
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
  }

  .event-time span {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 8.5px;
    margin-top: 4px;
    letter-spacing: 0.8px;
    color: #fff;
  }

  /* =================================
     VENUE LOCATION (IN SAME BOX)
  ================================= */

  .event-venue {
    padding-top: 3px;
  }

  .venue-name {
    font-family: Georgia, serif;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .venue-address {
    font-family: Arial, sans-serif;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.92);
    letter-spacing: 0.3px;
    line-height: 1.35;
  }

  /* =================================
     FIXED MAP BUTTON
  ================================= */

  .map-button {
    position: fixed;
    z-index: 9999;

    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);

    background: #855c61;
    color: white;

    text-decoration: none;

    padding: 12px 28px;
    border-radius: 50px;

    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.5px;

    white-space: nowrap;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.32);

    transition: background 0.3s ease, transform 0.2s ease;
  }

  .map-button:hover {
    background: #674247;
    transform: translateX(-50%) scale(1.03);
  }

  /* =================================
     DESKTOP ONLY (SLIM HORIZONTAL CARD)
     Places card below couple's waist!
  ================================= */

  @media (min-width: 701px) {

    .hero-content {
      bottom: 78px;
      padding: 0 20px;
    }

    .event-details {
      width: min(92vw, 680px);
      padding: 13px 22px;

      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      grid-template-areas:
        "title times"
        "date times"
        "venue times";
      column-gap: 20px;
      row-gap: 2px;
      align-items: center;
      text-align: center;
    }

    .event-title {
      grid-area: title;
      font-size: 25px;
      margin: 0;
    }

    .event-date {
      grid-area: date;
      font-size: 15px;
      margin: 2px 0 5px;
    }

    .event-venue {
      grid-area: venue;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    .venue-name {
      font-size: 16px;
      margin-bottom: 1px;
    }

    .venue-address {
      font-size: 11.5px;
    }

    .event-times {
      grid-area: times;
      margin: 0;
      border-top: none;
      border-bottom: none;
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      padding-left: 16px;
    }

    .event-time {
      padding: 6px 4px;
    }

    .event-time div {
      font-size: 22px;
    }

    .event-time span {
      font-size: 9px;
    }

    .map-button {
      bottom: 22px;
      padding: 13px 32px;
      font-size: 13.5px;
    }

  }

  /* EXTRA SMALL PHONES */

  @media (max-width: 360px) {

    .hero-content {
      bottom: 60px;
      padding: 0 6px;
    }

    .event-details {
      padding: 10px 10px;
      max-width: 320px;
    }

    .event-title {
      font-size: 21px;
    }

    .event-date {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .event-times {
      margin-bottom: 6px;
    }

    .event-time {
      padding: 5px 2px;
    }

    .event-time div {
      font-size: 17px;
    }

    .venue-name {
      font-size: 14px;
    }

    .venue-address {
      font-size: 10.5px;
    }

    .map-button {
      bottom: 14px;
      padding: 10px 20px;
      font-size: 11.5px;
    }

  }

  </style>
</head>

<body>

  <!-- =================================
       HERO VIDEO (SINGLE FULL SCREEN)
  ================================= -->

  <section class="hero">

    <div class="hero-video">

      <!-- DESKTOP LANDSCAPE VIDEO -->

      <video
        class="desktop-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="{% static 'assets/hero_poster_desktop.webp' %}">

        <source
          src="{% static 'assets/animate hero.mp4' %}"
          type="video/mp4">

        <source
          src="https://invitation.biz499.com/static/assets/animate%20hero.mp4"
          type="video/mp4">

      </video>


      <!-- MOBILE VERTICAL VIDEO -->

      <video
        class="mobile-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="{% static 'assets/hero_poster_mobile.webp' %}">

        <source
          src="{% static 'assets/animate hero vertical.mp4' %}"
          type="video/mp4">

        <source
          src="https://invitation.biz499.com/static/assets/animate%20hero%20vertical.mp4"
          type="video/mp4">

      </video>

    </div>


    <!-- EVENT DETAILS CARD (BELOW FACES - COMPLETELY UNOBSTRUCTED) -->

    <div class="hero-content">

      <div class="event-details">

        <!-- TITLE -->
        <div class="event-title">
          Shrimant Sanskar
        </div>

        <!-- DATE (BIGGER) -->
        <div class="event-date">
          Thursday, 19 November 2026
        </div>


        <!-- CEREMONY AND LUNCH -->

        <div class="event-times">

          <div class="event-time">
            <div>10:30 AM</div>
            <span>CEREMONY BEGINS</span>
          </div>

          <div class="event-time">
            <div>12:00 PM</div>
            <span>LUNCH</span>
          </div>

        </div>


        <!-- VENUE LOCATION (IN SAME BOX) -->

        <div class="event-venue">
          <div class="venue-name">The Grand Murli</div>
          <div class="venue-address">Near Mahavir College, Vesu, Surat</div>
        </div>

      </div>

    </div>

  </section>


  <!-- =================================
       ALWAYS VISIBLE MAP BUTTON
  ================================= -->

  <a
    class="map-button"
    href="https://www.google.com/maps/search/?api=1&query=The+Grand+Murli+Near+Mahavir+College+Vesu+Surat"
    target="_blank"
    rel="noopener">

    📍 VIEW ON MAP

  </a>

</body>
</html>

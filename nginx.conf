server {
    listen 80;
    server_name invitation.biz499.com;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Django collected static files (generated via collectstatic)
    location /static/ {
        alias /var/www/babyshower/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Direct static assets compatibility
    location /assets/ {
        alias /var/www/babyshower/staticfiles/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location "/new assets to be used/" {
        alias "/var/www/babyshower/staticfiles/new assets to be used/";
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gunicorn WSGI proxy for Django application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
